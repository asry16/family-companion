version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  command: node dist/index.js
  network:
    port: 3001
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: 3001
    - name: AWS_REGION
      value: us-east-1
